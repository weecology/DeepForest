name: Remove waiting labels

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-label:
    runs-on: ubuntu-latest
    if: |
      (
        github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.type != 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event.label.name == 'Author responded' &&
        (
          github.event_name == 'issues' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        )
      )
    steps:
    - name: Remove label
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: |
          const issueNumber = context.issue.number || context.pull_request.number;
          const repo = context.repo;
          const labelToRemove = "Awaiting author contribution";

          const { data: issueLabels } = await github.rest.issues.listLabelsOnIssue({
            ...repo,
            issue_number: issueNumber
          });

          if (issueLabels.find(label => label.name === labelToRemove)) {
            await github.rest.issues.removeLabel({
              ...repo,
              issue_number: issueNumber,
              name: labelToRemove
            });
          }
